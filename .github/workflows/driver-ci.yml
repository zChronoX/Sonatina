name: Sonatina CI (Python + A1 Host + A2 Driver)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  python-and-host-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: python -m pip install numpy

      - name: Run Python unit tests
        working-directory: sonatina
        run: python -m unittest discover -s tests -v

      - name: Run A1 host protocol tests (C vs Python)
        run: powershell -ExecutionPolicy Bypass -File sonatina\driver\tests\run_host_tests.ps1

      - name: Run T2 C-driver <-> Python-sink UDP loopback tests
        run: |
          powershell -ExecutionPolicy Bypass -File sonatina\driver\tests\run_loopback_e2e.ps1 -Seconds 2 -SignalPort 5105 -MediaPort 5104 -Codec sbc
          powershell -ExecutionPolicy Bypass -File sonatina\driver\tests\run_loopback_e2e.ps1 -Seconds 2 -SignalPort 5115 -MediaPort 5114 -Codec sbc -SimulateCongestion
          powershell -ExecutionPolicy Bypass -File sonatina\driver\tests\run_loopback_e2e.ps1 -Seconds 2 -SignalPort 5125 -MediaPort 5124 -Codec ldac

      - name: Run T4 quality report sweep
        run: python sonatina\driver\tests\quality_report.py --seconds 1

      - name: Build native service (SonatinaSvc.exe)
        run: powershell -ExecutionPolicy Bypass -File sonatina\service\build_service.ps1

      - name: Smoke-test SonatinaSvc.exe and installer scripts
        run: |
          .\sonatina\service\build\SonatinaSvc.exe --help
          powershell -ExecutionPolicy Bypass -File sonatina\scripts\install-driver.ps1 -DryRun
          powershell -ExecutionPolicy Bypass -File sonatina\scripts\uninstall-driver.ps1 -DryRun
          powershell -ExecutionPolicy Bypass -File sonatina\scripts\build-gui.ps1 -CheckOnly

  driver-compile-x64:
    runs-on: windows-latest
    strategy:
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Setup 64-bit MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Restore WDK and Windows SDK NuGet packages
        run: |
          nuget install Microsoft.Windows.WDK.x64 -ExcludeVersion -OutputDirectory sonatina\driver\packages

      - name: Build SonatinaAudio.sys (${{ matrix.configuration }}|x64)
        run: |
          msbuild sonatina\driver\SonatinaAudio.vcxproj /m /p:Configuration=${{ matrix.configuration }} /p:Platform=x64 /p:SignMode=Off

      - name: Run InfVerif /w
        run: |
          $infVerif = Get-ChildItem -Path sonatina\driver\packages -Filter InfVerif.exe -Recurse |
            Where-Object { $_.FullName -match '\\(x64|x86)\\' } |
            Select-Object -First 1
          if (-not $infVerif) { throw 'InfVerif.exe not found in restored WDK packages' }
          & $infVerif.FullName /w sonatina\driver\inf\SonatinaAudio.inf

      - name: Upload driver build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SonatinaAudio-${{ matrix.configuration }}-x64
          path: sonatina\driver\build\x64\${{ matrix.configuration }}\

      # Ready-to-install package for the test VM: driver test-signed with a
      # throw-away self-signed certificate (exported as SonatinaTest.cer), the
      # native service and the install / uninstall / status scripts.
      - name: Build native service for the VM package
        run: powershell -ExecutionPolicy Bypass -File sonatina\service\build_service.ps1

      - name: Test-sign and assemble the VM package
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $cfg = '${{ matrix.configuration }}'
          $inf = Get-ChildItem "sonatina\driver\build\x64\$cfg" -Recurse -Filter SonatinaAudio.inf |
            Where-Object { Test-Path (Join-Path $_.DirectoryName 'SonatinaAudio.cat') } | Select-Object -First 1
          if (-not $inf) { throw 'packaged SonatinaAudio.inf/.cat not found' }
          $out = Join-Path $env:RUNNER_TEMP 'SonatinaVM'
          New-Item -ItemType Directory -Force -Path "$out\driver", "$out\scripts" | Out-Null
          foreach ($f in 'SonatinaAudio.inf', 'SonatinaAudio.sys', 'SonatinaAudio.cat') {
            Copy-Item (Join-Path $inf.DirectoryName $f) "$out\driver\"
          }
          # Symbols for crash-dump analysis (WinDbg !analyze); not installed by the INF.
          $pdb = Get-ChildItem "sonatina\driver\build\x64\$cfg" -Recurse -Filter SonatinaAudio.pdb | Select-Object -First 1
          if ($pdb) { New-Item -ItemType Directory -Force -Path "$out\symbols" | Out-Null; Copy-Item $pdb.FullName "$out\symbols\" }
          else { Write-Warning 'SonatinaAudio.pdb not found; package has no symbols' }
          $signtool = Get-ChildItem 'sonatina\driver\packages', 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe not found' }
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=Sonatina Test Signing' `
            -CertStoreLocation Cert:\CurrentUser\My -HashAlgorithm SHA256 -NotAfter (Get-Date).AddYears(2)
          Export-Certificate -Cert $cert -FilePath "$out\SonatinaTest.cer" | Out-Null
          # Signing the .sys does not change its Authenticode hash, so the catalog stays valid.
          foreach ($f in "$out\driver\SonatinaAudio.sys", "$out\driver\SonatinaAudio.cat") {
            & $signtool.FullName sign /fd SHA256 /s My /sha1 $cert.Thumbprint $f
            if ($LASTEXITCODE -ne 0) { throw "signtool failed on $f" }
          }
          Copy-Item sonatina\service\build\SonatinaSvc.exe "$out\"
          Copy-Item sonatina\scripts\install-driver.ps1, sonatina\scripts\uninstall-driver.ps1, sonatina\scripts\driver-status.ps1 "$out\scripts\"
          Get-ChildItem $out -Recurse | Select-Object FullName, Length | Format-Table -AutoSize

      - name: Upload VM package
        uses: actions/upload-artifact@v4
        with:
          name: Sonatina-VM-${{ matrix.configuration }}-x64
          path: ${{ runner.temp }}\SonatinaVM\

  driver-compile-arm64:
    runs-on: windows-latest
    strategy:
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Restore WDK ARM64 and Windows SDK NuGet packages
        run: |
          nuget install Microsoft.Windows.WDK.ARM64 -ExcludeVersion -OutputDirectory sonatina\driver\packages

      - name: Build SonatinaAudio.sys (${{ matrix.configuration }}|ARM64)
        run: |
          msbuild sonatina\driver\SonatinaAudio.vcxproj /m /p:Configuration=${{ matrix.configuration }} /p:Platform=ARM64 /p:SignMode=Off

      - name: Run InfVerif /w (ARM64)
        run: |
          $infVerif = Get-ChildItem -Path sonatina\driver\packages -Filter InfVerif.exe -Recurse |
            Where-Object { $_.FullName -match '\\(x64|x86)\\' } |
            Select-Object -First 1
          if ($infVerif) {
            & $infVerif.FullName /w sonatina\driver\inf\SonatinaAudio.inf
          } else {
            Write-Host 'Host-arch InfVerif.exe not present in ARM64 WDK package (validated in driver-compile-x64).'
          }

      - name: Upload ARM64 driver build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SonatinaAudio-${{ matrix.configuration }}-ARM64
          path: sonatina\driver\build\ARM64\${{ matrix.configuration }}\
