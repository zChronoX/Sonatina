name: Sonatina host (tests + installer)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'sonatina/host/**'
      - 'sonatina/installer/**'
      - 'sonatina/driver/src/codec_*'
      - 'sonatina/driver/third_party/**'
      - '.github/workflows/host.yml'
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      installer:
        description: 'Build SonatinaSetup.exe'
        type: boolean
        default: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install -r sonatina/host/requirements.txt
      - name: Build the codec library (Linux, for the tests)
        working-directory: sonatina/host/codec
        run: sh build_codec.sh so
      - name: Virtual end-to-end tests (Bumble virtual controllers)
        working-directory: sonatina/host/tests
        run: |
          python e2e_virtual.py
          python pair_virtual.py
          python switch_virtual.py
          python avrcp_virtual.py

  installer:
    needs: tests
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.installer)
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      LIBWDI_COMMIT: 30df0c0e051b0132c4b9ebed8c054bc8eb3aaaec
      WDK_URL: https://go.microsoft.com/fwlink/p/?LinkID=253170
      FW_URL: https://gitlab.com/kernel-firmware/linux-firmware/-/raw/main/rtl_bt
    steps:
      - uses: actions/checkout@v4

      - name: Version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; else V="0.0.${GITHUB_RUN_NUMBER}-dev"; fi
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"

      # ---- wdi-simple (libwdi, LGPL): binds WinUSB to the chosen adapter, like Zadig
      - uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            base-devel
            autotools
            git
      - name: Download WDK 8 redistributables (WinUSB co-installers for libwdi)
        shell: cmd
        run: |
          git clone https://github.com/pbatard/libwdi.git libwdi
          git -C libwdi checkout %LIBWDI_COMMIT%
          curl -L %WDK_URL% -o wdk-redist.msi
          msiexec /a wdk-redist.msi /qn TARGETDIR=%CD%\libwdi\wdk
      - name: Build wdi-simple.exe
        shell: msys2 {0}
        working-directory: libwdi
        run: |
          ./bootstrap.sh
          ./configure --build=x86_64-w64-mingw32 --host=x86_64-w64-mingw32 --enable-examples-build \
            --disable-debug --disable-shared --disable-32bit \
            --with-wdkdir="wdk/Windows Kits/8.0" --with-wdfver=1011
          make
          mkdir -p ../build/wdi
          cp examples/wdi-simple.exe ../build/wdi/

      # ---- Realtek firmware (linux-firmware rtl_bt, redistributable)
      - name: Realtek firmware
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/firmware | Out-Null
          foreach ($f in 'rtl8761bu_fw.bin','rtl8761bu_config.bin') {
            Invoke-WebRequest "$env:FW_URL/$f" -OutFile "build/firmware/$f"
          }
          # Licence text (non fatal: the file has moved around in linux-firmware)
          $lic = 'build/firmware/LICENCE.rtlwifi_firmware.txt'
          $got = $false
          foreach ($u in 'https://gitlab.com/kernel-firmware/linux-firmware/-/raw/main/LICENCE.rtlwifi_firmware.txt',
                         'https://gitlab.com/kernel-firmware/linux-firmware/-/raw/main/licenses/LICENCE.rtlwifi_firmware.txt',
                         'https://raw.githubusercontent.com/endlessm/linux-firmware/master/LICENCE.rtlwifi_firmware.txt') {
            try { Invoke-WebRequest $u -OutFile $lic -ErrorAction Stop; $got = $true; break } catch { Write-Host "not at $u" }
          }
          if (-not $got) {
            Set-Content $lic "Realtek Bluetooth firmware from linux-firmware (rtl_bt), redistributable under LICENCE.rtlwifi_firmware.txt: https://gitlab.com/kernel-firmware/linux-firmware"
          }
          Get-ChildItem build/firmware

      # ---- Sonatina.exe (PyInstaller, no Python needed on the PC)
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: PyInstaller
        shell: pwsh
        run: |
          python -m pip install -r sonatina/host/requirements.txt pyinstaller
          python -m PyInstaller --noconfirm --windowed --name Sonatina `
            --icon sonatina/installer/sonatina.ico `
            --distpath build/dist --workpath build/pyi `
            --paths sonatina/host `
            --add-binary "sonatina/host/codec/sonatina_codec.dll;codec" `
            --collect-submodules bumble --collect-data bumble `
            --collect-all libusb_package --collect-all _sounddevice_data `
            --hidden-import pystray._win32 --hidden-import pycaw.pycaw `
            sonatina/host/sonatina_tray.py
          Get-ChildItem build/dist/Sonatina | Select-Object -First 20

      # ---- SonatinaSetup.exe (Inno Setup)
      - name: Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=$env:APP_VERSION /DBuildDir="$PWD\build" sonatina\installer\sonatina.iss
          Get-ChildItem build/installer

      - uses: actions/upload-artifact@v4
        with:
          name: SonatinaSetup-${{ env.APP_VERSION }}
          path: build/installer/*.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/installer/*.exe
